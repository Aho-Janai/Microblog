{% extends "base.html" %}

{% block content %}
<main class="container max-w-xl mx-auto px-4 py-8">
	<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
		<h1 class="text-2xl font-bold text-gray-900 mb-4">Basic Math Questions</h1>

		<div id="math-question" aria-live="polite" class="text-xl font-medium text-gray-700 mb-4"></div>

		<div class="flex gap-2 mb-4">
			<input
				id="math-answer"
				type="number"
				placeholder="Your answer"
				aria-label="Math answer"
				class="flex-1 rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
			>
		</div>

		<div class="flex gap-2 mb-4">
			<button
				type="button"
				onclick="checkAnswer()"
				class="rounded-md bg-blue-600 px-4 py-2 text-white font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
			>
				Check answer
			</button>
			<button
				type="button"
				onclick="newQuestion()"
				class="rounded-md bg-gray-100 px-4 py-2 text-gray-700 font-medium hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2"
			>
				New question
			</button>
		</div>

		<p id="math-result" class="text-sm font-medium"></p>
	</div>
</main>

<script>
	let answer;

	function newQuestion() {
		const first = Math.floor(Math.random() * 20) + 1;
		const second = Math.floor(Math.random() * 20) + 1;
		const operations = [
			[`${first} + ${second}`, first + second],
			[`${first} - ${second}`, first - second],
			[`${first} × ${second}`, first * second]
		];
		const question = operations[Math.floor(Math.random() * operations.length)];
		document.getElementById('math-question').textContent = `${question[0]} = ?`;
		answer = question[1];
		document.getElementById('math-answer').value = '';
		document.getElementById('math-result').textContent = '';
	}

	function checkAnswer() {
		const result = document.getElementById('math-result');
		const guess = Number(document.getElementById('math-answer').value);
		const correct = guess === answer;
		result.textContent = correct ? 'Correct!' : `Try again. The answer is ${answer}.`;
		result.className = correct
			? 'text-sm font-medium text-green-600'
			: 'text-sm font-medium text-red-600';
	}

	newQuestion();
</script>
{% endblock %}
